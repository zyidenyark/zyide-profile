<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyide wew - Profile Card</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Caprasimo & DM Serif Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- Link to CSS -->
  <link rel="stylesheet" href="zyd.css">
</head>
<body>

  <!-- Blurred Image Background Layer -->
  <div class="bg-blur"></div>

  <main class="card-container">
    <div class="card">
      <div class="image-wrapper">
        <img src="zyd.jpg" alt="zyd image" class="zyd-img">
      </div>

      <div class="card-content">
        <h1 class="name">Zyide wew</h1>
        
        <div class="social-links">
          <!-- Discord Link -->
          <a href="https://discord.gg/UJKNXRThv" target="_blank" rel="noopener noreferrer" aria-label="Discord">
            <i class="fa-brands fa-discord"></i>
          </a>

          <!-- Instagram Link -->
          <a href="https://www.instagram.com/zyide_0419/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>

          <!-- Spotify Link -->
          <a href="https://open.spotify.com/user/31kjw7m52et6rmmk3vz3okigapui?si=c0d63cbac8ba4db6" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
            <i class="fa-brands fa-spotify"></i>
          </a>
        </div>

        <!-- Banners List -->
        <div class="banners-list">
          
          <!-- Banner 1 -->
          <a href="https://www.tiktok.com/@wavetozid?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner">
            <div class="server-img-wrapper">
              <img src="dog.jpg" alt="TikTok Thumbnail" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">tiktok account</span>
            </div>
          </a>

          <!-- Banner 2 -->
          <a href="https://www.tiktok.com/@zydzydxd?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner">
            <div class="server-img-wrapper">
              <img src="dogg.jpg" alt="TikTok Thumbnail" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">tiktok account</span>
            </div>
          </a>

          <!-- Banner 3 -->
          <a href="https://www.tiktok.com/@zidgdp?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner">
            <div class="server-img-wrapper">
              <img src="doggg.jpg" alt="TikTok Thumbnail" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">tiktok account</span>
            </div>
          </a>

        </div>

      </div>
    </div>
  </main>

  <script src="zyd.js"></script>
</body>
</html>
