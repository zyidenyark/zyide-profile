<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zyidenyark - Profile Card</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Link to CSS -->
  <link rel="stylesheet" href="zyd.css">
</head>
<body>

  <!-- Blurred Background Layer -->
  <div class="bg-blur"></div>

  <main class="card-container">
    <div class="card">

      <!-- Top Main Image Frame -->
      <div class="image-wrapper" style="--i: 1;">
        <!-- Auto Switching Profile Images -->
        <img src="zyd.jpg" alt="Profile Image 1" class="zyd-img active">
        <img src="zydd.jpg" alt="Profile Image 2" class="zyd-img">

        <!-- Bottom Fade & Text Overlay -->
        <div class="image-overlay">
          <!-- Name -->
          <h1 class="name">zyidenyark</h1>

          <!-- Social Icons Row directly below the name -->
          <div class="social-links">
            <a href="https://discord.gg/Av3JAknFS" target="_blank" rel="noopener noreferrer" aria-label="Discord Server">
              <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://www.instagram.com/zyide_0419/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://open.spotify.com/user/31kjw7m52et6rmmk3vz3okigapui?si=c0d63cbac8ba4db6" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
              <i class="fa-brands fa-spotify"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Card Content Below Image -->
      <div class="card-content">

        <!-- Discord User Pill Tag -->
        <a href="https://discordapp.com/users/973485588143546398" target="_blank" rel="noopener noreferrer" class="discord-tag" style="--i: 2;">
          <i class="fa-brands fa-discord"></i>
          <span>_zyide</span>
        </a>

        <!-- Section Label -->
        <div class="section-label" style="--i: 2.5;">
          <i class="fa-brands fa-tiktok"></i> TikTok Accounts
        </div>

        <!-- Banners List -->
        <div class="banners-list">
          <!-- Banner 1 -->
          <a href="https://www.tiktok.com/@wavetozid?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner" style="--i: 3;">
            <div class="server-img-wrapper">
              <img src="dog.jpg" alt="wavetozid TikTok" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">@wavetozid</span>
            </div>
          </a>

          <!-- Banner 2 -->
          <a href="https://www.tiktok.com/@zydzydxd?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner" style="--i: 3.5;">
            <div class="server-img-wrapper">
              <img src="dogg.jpg" alt="zydzydxd TikTok" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">@zydzydxd</span>
            </div>
          </a>

          <!-- Banner 3 -->
          <a href="https://www.tiktok.com/@zidgdp?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" class="server-banner" style="--i: 4;">
            <div class="server-img-wrapper">
              <img src="doggg.jpg" alt="zidgdp TikTok" class="server-img">
            </div>
            <div class="server-text-wrapper">
              <span class="server-title">@zidgdp</span>
            </div>
          </a>
        </div>

      </div>
    </div>
  </main>

  <script src="zyd.js"></script>
</body>
</html>
